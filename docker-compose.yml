services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      # Local-dev-only throwaway credentials, not a real secret.
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpassword_local_only
      POSTGRES_DB: way_to_credit
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d way_to_credit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
