name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          # Local/CI-only throwaway credentials, not a real secret.
          POSTGRES_USER: devuser
          POSTGRES_PASSWORD: devpassword_local_only
          POSTGRES_DB: way_to_credit
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U devuser -d way_to_credit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgres://devuser:devpassword_local_only@localhost:5433/way_to_credit
      REDIS_URL: redis://localhost:6380
      CORS_ORIGIN: http://localhost:5173
      # CI-only fixture, not a real secret — just needs to satisfy config/env.ts's
      # 32-character minimum so the app boots for tests. No production meaning.
      JWT_SECRET: ci_only_not_a_real_secret_min_32_chars_long

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # The postgres service's healthcheck passing only means pg_isready
      # succeeded *inside* the container — not that the host-mapped port is
      # accepting connections yet, and drizzle-kit has no retry logic of its
      # own. Retry the migration itself (a real query, the strongest
      # readiness signal there is) rather than trust the healthcheck alone.
      - name: Wait for Postgres and run migrations
        run: |
          for i in $(seq 1 30); do
            if pnpm db:migrate; then
              echo "Migrations applied (attempt $i)."
              exit 0
            fi
            echo "Postgres not ready yet (attempt $i/30) — retrying in 2s..."
            sleep 2
          done
          echo "::error::Postgres never accepted a connection after 30 attempts."
          exit 1

      # No test seeds or depends on seeded fixture data (every test builds
      # its own via createTestAdmin/createTestUser-style helpers) — running
      # db:seed here would just be unused work, not a test dependency.

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
